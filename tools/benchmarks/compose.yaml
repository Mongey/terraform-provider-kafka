name: kafka-refresh-benchmark

x-environment: &environment
  CLUSTER_ID: ${BENCH_KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

x-broker: &broker
  image: apache/kafka-native:3.8.0

services:
  kafka1:
    <<: *broker
    hostname: kafka1
    environment:
      <<: *environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9094,EXTERNAL://127.0.0.1:${BENCH_KAFKA_PORT1:-19092}
    ports: ["127.0.0.1:${BENCH_KAFKA_PORT1:-19092}:9092"]
  kafka2:
    <<: *broker
    hostname: kafka2
    environment:
      <<: *environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9094,EXTERNAL://127.0.0.1:${BENCH_KAFKA_PORT2:-29092}
    ports: ["127.0.0.1:${BENCH_KAFKA_PORT2:-29092}:9092"]
  kafka3:
    <<: *broker
    hostname: kafka3
    environment:
      <<: *environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9094,EXTERNAL://127.0.0.1:${BENCH_KAFKA_PORT3:-39092}
    ports: ["127.0.0.1:${BENCH_KAFKA_PORT3:-39092}:9092"]
